    <!-- Theme Bootstrap - Apply dark class before React mounts -->
    <script>
      (function() {
        // Ensure dark theme is applied immediately
        document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = '#171717';
        document.documentElement.style.color = '#f2ede7';
        
        // Also set on body for extra safety
        if (document.body) {
          document.body.style.backgroundColor = '#171717';
          document.body.style.color = '#f2ede7';
        }
        
        // Store theme preference
        const theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

      <!-- Keep an unanchored home reload at its previous position without changing hero layout.
           A new visit still starts at the top; intentional navigation always wins. -->
      <script id="home-scroll-bootstrap">
        (function() {
          try {
            if ('scrollRestoration' in window.history) {
              window.history.scrollRestoration = "manual";
            }

            var positionKey = "wlm-home-reload-position-v1";
            var pageUrl = window.location.pathname + window.location.search;
            var reloadTop = 0;
            var protectionActive = false;
            var pullStart;
            var pullPosition;
            var pullExpires = 0;
            var storedPosition;
            try {
              storedPosition = JSON.parse(window.sessionStorage.getItem(positionKey) || "null");
              var navigation = window.performance.getEntriesByType("navigation")[0];
              if (navigation && navigation.type === "reload" && storedPosition &&
                  storedPosition.url === pageUrl && storedPosition.width === window.innerWidth &&
                  typeof storedPosition.top === "number" && isFinite(storedPosition.top) &&
                  storedPosition.top >= 0) {
                reloadTop = storedPosition.top;
              }
            } catch (_storageError) {
              // Private/storage-restricted browsers still get the ordinary top-of-page fallback.
            }

            var isUnanchoredHome = function() {
              return window.location.pathname === "/" && !window.location.hash;
            };

            var isSameUnanchoredHome = function() {
              return isUnanchoredHome() &&
                window.location.pathname + window.location.search === pageUrl;
            };

            var savePosition = function(top) {
              if (!isUnanchoredHome()) return;
              try {
                window.sessionStorage.setItem(positionKey, JSON.stringify({
                  url: window.location.pathname + window.location.search,
                  width: window.innerWidth, top: Math.max(0, top)
                }));
              } catch (_storageError) {}
            };

            var rememberPosition = function() {
              if (protectionActive || !isUnanchoredHome()) return;
              // Native pulling moves the document to/above zero before the reload starts.
              // Retain the pre-pull position briefly, not that transient overscroll position.
              if (pullPosition !== undefined && window.scrollY <= 0 && Date.now() < pullExpires) {
                savePosition(pullPosition);
                return;
              }
              pullPosition = undefined;
              savePosition(window.scrollY);
            };

            window.addEventListener("scroll", rememberPosition, { passive: true });
            window.addEventListener("pagehide", rememberPosition);
            window.addEventListener("touchstart", function(event) {
              if (!isUnanchoredHome() || !event.touches || event.touches.length !== 1) return;
              pullStart = { y: event.touches[0].clientY, top: Math.max(0, window.scrollY) };
              pullPosition = undefined;
            }, { passive: true });
            window.addEventListener("touchmove", function(event) {
              if (!pullStart || !event.touches || event.touches.length !== 1) return;
              if (event.touches[0].clientY > pullStart.y && window.scrollY <= 0) {
                pullPosition = pullStart.top;
                pullExpires = Date.now() + 2000;
                savePosition(pullPosition);
              } else if (event.touches[0].clientY < pullStart.y) {
                pullPosition = undefined;
              }
            }, { passive: true });
            window.addEventListener("touchcancel", function() {
              pullStart = undefined;
            }, { passive: true });
            var cancelPullPosition = function() {
              pullPosition = undefined;
              pullStart = undefined;
            };
            window.addEventListener("wheel", cancelPullPosition, { passive: true });
            window.addEventListener("pointerdown", cancelPullPosition, { passive: true });
            window.addEventListener("keydown", cancelPullPosition);

            // The passive recorder also works after SPA navigation from a detail URL.
            // Only an initial unanchored Home document gets the finite correction phase.
            if (window.location.pathname !== "/" || window.location.hash) return;
            // Do not let a previous visit's position leak into a quick subsequent reload.
            savePosition(reloadTop);

            var stopped = false;
            var lifecycleSeen = false;
            var resetTimers = [];
            var releaseTimer;
            var frameId;
            var inputEvents = ["touchstart", "wheel", "pointerdown", "keydown"];

            var clearScheduledResets = function() {
              resetTimers.forEach(window.clearTimeout);
              resetTimers = [];
              window.clearTimeout(releaseTimer);
              if (frameId !== undefined) window.cancelAnimationFrame(frameId);
            };

            var stopHomeScrollProtection = function() {
              stopped = true;
              protectionActive = false;
              clearScheduledResets();
              window.removeEventListener("scroll", lockHomeScroll);
              window.removeEventListener("load", onHomeReady);
              window.removeEventListener("pageshow", onHomeReady);
              inputEvents.forEach(function(event) {
                window.removeEventListener(event, stopHomeScrollProtection);
              });
            };

            var resetHomeScroll = function() {
              if (stopped) return;
              if (!isSameUnanchoredHome()) {
                stopHomeScrollProtection();
                return;
              }
              // "auto" inherits CSS smooth scrolling; reload correction must not animate.
              window.scrollTo({ top: reloadTop, left: 0, behavior: "instant" });
            };

            var lockHomeScroll = function() {
              if (window.scrollY !== reloadTop) resetHomeScroll();
            };

            var scheduleHomeScrollReset = function() {
              if (stopped) return;
              clearScheduledResets();
              protectionActive = true;
              resetHomeScroll();
              if (stopped) return;
              window.addEventListener("scroll", lockHomeScroll, { passive: true });
              frameId = window.requestAnimationFrame(resetHomeScroll);
              resetTimers.push(window.setTimeout(resetHomeScroll, 120));
              resetTimers.push(window.setTimeout(resetHomeScroll, 500));
              // Keep the same finite window, but start it at load/pageshow as well as parsing.
              releaseTimer = window.setTimeout(function() {
                window.removeEventListener("scroll", lockHomeScroll);
                clearScheduledResets();
                protectionActive = false;
                if (lifecycleSeen) {
                  stopHomeScrollProtection();
                  rememberPosition();
                }
              }, 1000);
            };

            var onHomeReady = function() {
              lifecycleSeen = true;
              scheduleHomeScrollReset();
            };

            // Never fight deliberate scrolling, another pull gesture, or anchor navigation.
            inputEvents.forEach(function(event) {
              window.addEventListener(event, stopHomeScrollProtection, { passive: true });
            });
            window.addEventListener("pageshow", onHomeReady, { once: true });
            window.addEventListener("load", onHomeReady, { once: true });
            scheduleHomeScrollReset();
          } catch (_error) {
            // The page remains usable if a browser does not expose scroll-restoration APIs.
          }
        })();
      </script>
